openapi: 3.1.0
info:
  # IMPORTANT: do not change this title — it controls generated filenames in lib/api-client-react
  title: Api
  version: 1.0.0
  description: >
    ROBINS-I V2 Risk-of-Bias Assessment API.

    Provides endpoints for managing studies (the research papers being assessed)
    and domain assessments (the risk-of-bias judgements for each of the 7 ROBINS-I domains).

    Each study uses either Variant A (intention-to-treat / ITT) for Domain 1,
    or Variant B (per-protocol) — never both. Domains 2–6 are the same for all studies.

servers:
  - url: /api
    description: Shared reverse-proxy API prefix

tags:
  - name: health
    description: Server health check

  - name: studies
    description: >
      Research studies being assessed for risk of bias.
      Each study has a name, optional description, and a domain-1 variant (ITT or per-protocol).

  - name: assessments
    description: >
      Domain-level risk-of-bias assessments for a given study.
      One assessment record per domain per study.
      Stores the full question answers (JSONB) and the computed outcome level.

  - name: dashboard
    description: >
      Read-only aggregation endpoints for the dashboard overview page.
      Returns summary counts, risk breakdowns, and recent activity.

paths:
  # ── Health ────────────────────────────────────────────────────────────────
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns HTTP 200 with status "ok" if the server is running normally.
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Studies ───────────────────────────────────────────────────────────────
  /studies:
    get:
      operationId: listStudies
      tags: [studies]
      summary: List all studies
      description: >
        Returns all studies ordered by creation date descending (newest first).
        Each study includes a summary of how many domains have been assessed
        and the overall worst risk level found so far.
      responses:
        "200":
          description: Array of study summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudySummary"

    post:
      operationId: createStudy
      tags: [studies]
      summary: Create a new study
      description: >
        Creates a new study to be assessed. The caller must choose whether
        Domain 1 will use Variant A (ITT / intention-to-treat) or Variant B
        (per-protocol). This choice cannot be changed after assessments are saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudyBody"
      responses:
        "201":
          description: Study created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Study"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /studies/{studyId}:
    get:
      operationId: getStudy
      tags: [studies]
      summary: Get a study with all its domain assessments
      description: >
        Returns the full study record plus all saved domain assessments.
        Use this to render the study detail page and the assessment wizard.
      parameters:
        - $ref: "#/components/parameters/StudyIdParam"
      responses:
        "200":
          description: Study with assessments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyWithAssessments"
        "404":
          description: Study not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateStudy
      tags: [studies]
      summary: Update study metadata
      description: >
        Updates the study name and/or description. The domain-1 variant
        cannot be changed once assessments exist for Domain 1.
      parameters:
        - $ref: "#/components/parameters/StudyIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudyBody"
      responses:
        "200":
          description: Updated study
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Study"
        "404":
          description: Study not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteStudy
      tags: [studies]
      summary: Delete a study and all its assessments
      description: >
        Permanently deletes the study and all associated domain assessments.
        This action is irreversible.
      parameters:
        - $ref: "#/components/parameters/StudyIdParam"
      responses:
        "204":
          description: Deleted successfully (no body)
        "404":
          description: Study not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Assessments ───────────────────────────────────────────────────────────
  /studies/{studyId}/assessments:
    get:
      operationId: listAssessments
      tags: [assessments]
      summary: List all domain assessments for a study
      description: >
        Returns the saved assessment for each domain that has been completed.
        Domains not yet assessed are simply absent from this list.
      parameters:
        - $ref: "#/components/parameters/StudyIdParam"
      responses:
        "200":
          description: Array of domain assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DomainAssessment"

  /studies/{studyId}/assessments/{domainId}:
    put:
      operationId: upsertAssessment
      tags: [assessments]
      summary: Save or update a domain assessment
      description: >
        Creates or replaces the assessment for a single domain.
        The domainId must be one of: "1a", "1b", "2", "3", "4", "5", "6".
        Domain "1a" and "1b" are mutually exclusive per study (enforced by server).
        The answers field holds the complete question/answer state from the wizard.
        The outcome field holds the computed risk level.
      parameters:
        - $ref: "#/components/parameters/StudyIdParam"
        - $ref: "#/components/parameters/DomainIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertAssessmentBody"
      responses:
        "200":
          description: Assessment saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainAssessment"
        "400":
          description: Validation error (e.g. wrong variant for this study)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Study not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteAssessment
      tags: [assessments]
      summary: Clear a domain assessment
      description: Removes the saved assessment for a single domain so it can be re-assessed.
      parameters:
        - $ref: "#/components/parameters/StudyIdParam"
        - $ref: "#/components/parameters/DomainIdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Assessment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Dashboard ─────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard overview statistics
      description: >
        Returns aggregated statistics for the dashboard landing page:
        total study count, assessments-complete count, risk-level breakdown,
        and the 5 most recently updated studies.
      responses:
        "200":
          description: Dashboard summary data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

# ─────────────────────────────────────────────────────────────────────────────
# Reusable Parameters
# ─────────────────────────────────────────────────────────────────────────────
components:
  parameters:
    StudyIdParam:
      name: studyId
      in: path
      required: true
      description: The integer primary key of the study.
      schema:
        type: integer

    DomainIdParam:
      name: domainId
      in: path
      required: true
      description: >
        The ROBINS-I domain identifier.
        Must be one of: "1a" (confounding ITT), "1b" (confounding per-protocol),
        "2", "3", "4", "5", "6".
      schema:
        type: string
        enum: ["1a", "1b", "2", "3", "4", "5", "6"]

  # ── Schemas ────────────────────────────────────────────────────────────────
  schemas:

    # ─ Shared ────────────────────────────────────────────────────────────────
    HealthStatus:
      type: object
      description: Simple server health indicator.
      properties:
        status:
          type: string
          example: "ok"
      required: [status]

    ErrorResponse:
      type: object
      description: Standard error envelope returned by all 4xx/5xx responses.
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: "Study not found"
      required: [error]

    # ─ Domain and risk-level enums ────────────────────────────────────────────
    DomainId:
      type: string
      description: >
        Which ROBINS-I domain this assessment covers.
        1a = Confounding (ITT / intention-to-treat).
        1b = Confounding (per-protocol).
        Domains 2–6 are shared regardless of variant.
      enum: ["1a", "1b", "2", "3", "4", "5", "6"]

    Domain1Variant:
      type: string
      description: >
        Which variant of Domain 1 to use for this study.
        "itt" = Variant A (intention-to-treat analysis).
        "per-protocol" = Variant B (per-protocol analysis).
        A study uses one variant for its entire lifetime.
      enum: ["itt", "per-protocol"]

    RiskLevel:
      type: string
      description: >
        The computed ROBINS-I risk-of-bias level for a domain.
        low         = Low risk of bias.
        low-except  = Low except for concerns about uncontrolled confounding (Domain 1B only).
        moderate    = Moderate risk.
        serious     = Serious risk.
        critical    = Critical risk.
      enum: ["low", "low-except", "moderate", "serious", "critical"]

    # ─ Study ─────────────────────────────────────────────────────────────────
    Study:
      type: object
      description: A single research study being assessed.
      properties:
        id:
          type: integer
          description: Auto-incremented primary key.
          example: 1
        name:
          type: string
          description: Short name / citation for the study.
          example: "Smith et al. 2022"
        description:
          type: string
          nullable: true
          description: Optional longer description or notes about the study.
          example: "RCT on hypertension treatment in elderly patients"
        domain1Variant:
          $ref: "#/components/schemas/Domain1Variant"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, domain1Variant, createdAt, updatedAt]

    StudySummary:
      type: object
      description: >
        Study record enriched with a snapshot of assessment progress.
        Used in the study list view.
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        domain1Variant:
          $ref: "#/components/schemas/Domain1Variant"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        assessedDomains:
          type: integer
          description: How many of the 6 required domains have been assessed so far.
          example: 3
        totalDomains:
          type: integer
          description: Total domains required for this study (always 6).
          example: 6
        worstOutcome:
          allOf:
            - $ref: "#/components/schemas/RiskLevel"
          nullable: true
          description: The most severe risk level found across all completed domains, or null if none assessed yet.
      required: [id, name, domain1Variant, createdAt, updatedAt, assessedDomains, totalDomains]

    StudyWithAssessments:
      type: object
      description: Full study record including all saved domain assessments.
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        domain1Variant:
          $ref: "#/components/schemas/Domain1Variant"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        assessments:
          type: array
          items:
            $ref: "#/components/schemas/DomainAssessment"
      required: [id, name, domain1Variant, createdAt, updatedAt, assessments]

    CreateStudyBody:
      type: object
      description: Fields required to create a new study.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 300
          description: Short reference name or citation for the study.
          example: "Jones et al. 2021"
        description:
          type: string
          nullable: true
          description: Optional notes or abstract summary.
        domain1Variant:
          $ref: "#/components/schemas/Domain1Variant"
      required: [name, domain1Variant]

    UpdateStudyBody:
      type: object
      description: Fields that can be updated on an existing study.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          nullable: true
      minProperties: 1

    # ─ Domain Assessment ──────────────────────────────────────────────────────
    DomainAssessment:
      type: object
      description: >
        The saved assessment for one ROBINS-I domain within a study.
        The answers field is a free-form JSON object that mirrors the
        question-state shape from the interactive wizard (e.g. { q11: "Y/PY", q12: "WN" }).
      properties:
        id:
          type: integer
        studyId:
          type: integer
        domainId:
          $ref: "#/components/schemas/DomainId"
        answers:
          type: object
          description: >
            Key-value pairs of question ID → selected answer.
            Shape varies per domain (e.g. Domain 1A uses q11/q12/q13/q14/q15;
            Domain 6 uses q61/q62/q63/q64). Stored as JSONB.
          additionalProperties: true
        outcome:
          $ref: "#/components/schemas/RiskLevel"
        notes:
          type: string
          nullable: true
          description: Optional free-text notes/justification written by the assessor.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, studyId, domainId, answers, outcome, createdAt, updatedAt]

    UpsertAssessmentBody:
      type: object
      description: Payload for saving or overwriting a domain assessment.
      properties:
        answers:
          type: object
          description: Complete question answers from the wizard (key = question ID, value = answer string).
          additionalProperties: true
        outcome:
          $ref: "#/components/schemas/RiskLevel"
        notes:
          type: string
          nullable: true
          description: Optional assessor notes.
      required: [answers, outcome]

    # ─ Dashboard ──────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      description: Aggregated statistics for the dashboard overview page.
      properties:
        totalStudies:
          type: integer
          description: Total number of studies in the system.
          example: 12
        fullyAssessed:
          type: integer
          description: Number of studies where all 6 domains have been assessed.
          example: 4
        riskBreakdown:
          $ref: "#/components/schemas/RiskBreakdown"
        recentStudies:
          type: array
          description: The 5 most recently updated studies (for the dashboard quick-access list).
          items:
            $ref: "#/components/schemas/StudySummary"
      required: [totalStudies, fullyAssessed, riskBreakdown, recentStudies]

    RiskBreakdown:
      type: object
      description: >
        Count of worst-outcome assessments at each risk level, across all studies.
        Useful for the dashboard risk distribution chart.
      properties:
        low:
          type: integer
          example: 2
        lowExcept:
          type: integer
          example: 1
        moderate:
          type: integer
          example: 4
        serious:
          type: integer
          example: 3
        critical:
          type: integer
          example: 2
      required: [low, lowExcept, moderate, serious, critical]
